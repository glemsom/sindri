[package]
name = "sindri"
description = "The Sindri front ends: the terminal UI and batch mode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.34"
pulldown-cmark = { version = "0.12", default-features = false }
# The frame: what a look is drawn with, and the same code a fixture renders through
# ratatui's headless backend, so a golden frame and a reader's screen are one picture.
ratatui = "0.29"
rustix = { version = "1.1.6", features = ["event", "fs", "termios"] }
sindri-core = { path = "../sindri-core" }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
# The golden frames of ADR 0012: `insta` compares a rendered frame against the fixture
# that holds it and blesses a deliberate change. It hard-codes the `.snap` extension,
# which is why a fixture's file is one, whatever the ADR first named.
insta = "1.49"
# The tests open a pseudo-terminal to prove what a launch draws and gives back:
# rustix already binds this crate's terminal, so a second binding to the same
# termios would be two ways to talk to one tty.
rustix = { version = "1.1.6", features = ["pty"] }
serde_json = "1.0"
tempfile = "3"
