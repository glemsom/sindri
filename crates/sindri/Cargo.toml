[package]
name = "sindri"
description = "The Sindri front ends: the terminal UI and batch mode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rustix = { version = "1.1.6", features = ["termios"] }
sindri-core = { path = "../sindri-core" }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3"
