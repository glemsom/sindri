[package]
name = "sindri"
description = "The Sindri front ends: the terminal UI and batch mode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.34"
# A mermaid fence becomes an SVG in this process, with no JavaScript and no browser to
# ask for a fact about a glyph (ADR-0003). Its `cli` and `png` features are off: this
# binary draws nothing itself, and `clap` for a command it does not have is a
# dependency that would say otherwise.
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
# The picture half of §12 (ADR-0003). `usvg` is built without its system-fonts feature on
# purpose: the font travels in the binary, and a build that cannot read the machine's fonts
# is a claim a reader can check rather than one a comment makes.
usvg = { version = "0.47", default-features = false, features = ["text"] }
resvg = "0.47"
tiny-skia = "0.12"
# The buffer a picture leaves as: straight RGBA, which is what a Kitty placement takes.
image = { version = "0.25", default-features = false }
pulldown-cmark = { version = "0.12", default-features = false }
# The frame: what a look is drawn with, and the same code a fixture renders through
# ratatui's headless backend, so a golden frame and a reader's screen are one picture.
ratatui = "0.29"
rustix = { version = "1.1.6", features = ["event", "fs", "termios"] }
sindri-core = { path = "../sindri-core" }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
# The golden frames of ADR 0012: `insta` compares a rendered frame against the fixture
# that holds it and blesses a deliberate change. It hard-codes the `.snap` extension,
# which is why a fixture's file is one, whatever the ADR first named.
insta = "1.49"
# The tests open a pseudo-terminal to prove what a launch draws and gives back:
# rustix already binds this crate's terminal, so a second binding to the same
# termios would be two ways to talk to one tty.
rustix = { version = "1.1.6", features = ["pty"] }
serde_json = "1.0"
tempfile = "3"
