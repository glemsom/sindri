[package]
name = "sindri-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The sindri binary: batch mode, the front end for humans and scripts."

[[bin]]
name = "sindri"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sindri-types.workspace = true
sindri-core.workspace = true
sindri-tui.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
sindri-core.workspace = true
sindri-harness.workspace = true
