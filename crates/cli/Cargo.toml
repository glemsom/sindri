[package]
name = "sindri-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The sindri binary: batch mode, the front end for humans and scripts."

[[bin]]
name = "sindri"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sindri-types.workspace = true
sindri-core.workspace = true
sindri-tui.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
sindri-harness.workspace = true
# A report's message is base64 on the wire, so the test that reads its words
# undoes the alphabet the encoder wrote it in rather than matching a encoding.
base64.workspace = true
# The listing tests measure a row in cells to prove one row is no wider than
# the column: the column itself is cut by `sindri-tui`, so no line of the
# binary's own measures one.
unicode-width.workspace = true
