[package]
name = "sindri-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The agent core: the sandbox policy, the two derivations from it, and the environment probe. Knows nothing about a terminal."

[lints]
workspace = true

[dependencies]
sindri-types.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
toml = "1"
# A `file:` URI is percent-decoded before the guard reads it, because the URI is a
# spelling of a path and not the name a filesystem holds. Already in the graph
# (through `url`), so this line costs no new dependency.
percent-encoding = "2"
# A skill's frontmatter is read as a value tree, so a key no version of the
# specification knows is ignored rather than refused. Already in the graph
# (through the diagram renderer), so this line costs no new dependency.
yaml-rust = "0.4"
# The catalog's columns are measured in cells, not bytes: a name is a name.
unicode-width.workspace = true
# A status report's values are base64, as its OSC 52 copy already was: one
# alphabet, and the crate that spells it.
base64.workspace = true
# Pinned to an exact version on purpose: a rig rewrite must touch
# `provider/rig_wire.rs` and nothing else.
rig-core = { version = "=0.45.0", default-features = false, features = ["rustls", "reqwest"] }
rig-reqwest = "=0.45.0"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
