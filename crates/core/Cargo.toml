[package]
name = "sindri-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The agent core: the sandbox policy, the two derivations from it, and the environment probe. Knows nothing about a terminal."

[lints]
workspace = true

[dependencies]
sindri-types.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
toml = "1"
# Pinned to an exact version on purpose: a rig rewrite must touch
# `provider/rig_wire.rs` and nothing else.
rig-core = { version = "=0.45.0", default-features = false, features = ["rustls", "reqwest"] }
rig-reqwest = "=0.45.0"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
