[package]
name = "sindri-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The terminal UI: a renderer of the core's event stream, holding no loop of its own (ADR-0011)."

[lints]
workspace = true

[dependencies]
sindri-core.workspace = true
ratatui.workspace = true
crossterm.workspace = true
ratatui-image.workspace = true
image.workspace = true
pulldown-cmark.workspace = true
syntect.workspace = true
unicode-width.workspace = true
libc = "0.2"

[dev-dependencies]
# The OSC 52 escape and the tool fallback are proven without a terminal and
# without touching the user's clipboard: a test writes to its own buffer and
# runs a fake `wl-copy` from a temporary `PATH`.
tempfile = "3"
