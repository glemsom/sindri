# CI runs `make check` in the same devbox shell a developer uses: one command, one set of
# stages, so there is no second, weaker definition of what "done" means.

# This runner refuses confinement: Ubuntu 24.04 ships AppArmor's
# `kernel.apparmor_restrict_unprivileged_userns=1`, so `bwrap --unshare-all` is refused and
# the sandbox stage prints `... SKIPPED` over a job that stays green.

# Where a sandbox cannot be made, the suites that are not about sandboxing still prove the
# batch contract with every child handed `--yolo-unsafe`, printing `skip batch:` to name
# the tier that run left uncovered.

name: check

on:
  push:
    branches: [main, spec/1-capability]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the older run's verdict irrelevant.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version a laptop pins too, so both materialise the same shell.
  DEVBOX_VERSION: 0.19.0

jobs:
  check:
    name: make check (devbox)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tree
        uses: actions/checkout@v4

      # devbox needs Nix underneath it, and the action turns on the `nix-command` and
      # `flakes` features devbox expects. Pinned to a commit, not a tag, so the code CI
      # runs cannot change under us.
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      # The release tarball, not the interactive installer: CI has no one to answer it.
      - name: Install devbox ${{ env.DEVBOX_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/jetify-com/devbox/releases/download/${DEVBOX_VERSION}/devbox_${DEVBOX_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP" devbox
          sudo install -m 0755 "$RUNNER_TEMP/devbox" /usr/local/bin/devbox
          devbox version

      # Keyed on the lockfile and the manifest, so a toolchain change misses the cache
      # instead of hiding behind a stale one.
      - name: Cache the pinned Rust toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/sindri
          key: sindri-toolchain-${{ runner.os }}-${{ hashFiles('devbox.lock', 'devbox.json') }}
          restore-keys: sindri-toolchain-${{ runner.os }}-

      - name: Materialise the devbox shell
        run: devbox install

      - name: make check, inside a devbox shell
        shell: bash
        run: |
          set -uo pipefail
          status=0
          devbox run -- make check 2>&1 | tee "$RUNNER_TEMP/check.log" || status=$?
          exit "$status"

      # A skipped sandbox tier must be visible where a reviewer looks: the stage lines are
      # copied verbatim, `... SKIPPED` and all, and a warning marks the uncovered tier.
      - name: Stage verdicts in the job summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/check.log"
          if [[ ! -f $log ]]; then
            echo "::warning title=No verdict lines::make check produced no log, so no stage reported a verdict in this run."
            exit 0
          fi
          {
            echo '### `make check` stage verdicts'
            echo
            echo '```'
            grep -E '^(check:|sandbox tier:|audit: |skip batch:)' "$log" || echo 'no verdict lines: the run stopped before a stage reported one'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'sandbox tier: skipped' "$log"; then
            echo "::warning title=Sandbox tier skipped::sandbox tier: skipped (bwrap unavailable) - this runner forbids unprivileged user namespaces, so confinement is uncovered by this run; every other stage ran."
          fi
