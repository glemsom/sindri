name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Git names the first branch itself otherwise, and checkout prints the
      # hint on every run.
      - name: Name the initial branch main
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v5
        with:
          # `git describe` and the commit date need history and tags.
          fetch-depth: 0

      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap
      # needs; the doctor tests prove the real sandbox, so lift the restriction.
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      # `make check` includes `make eval`, which runs the eight evals against
      # the recorded fixtures: no credential, no live model, deterministic.
      - name: make check
        run: devbox run -- make check
