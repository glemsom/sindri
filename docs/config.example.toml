# $XDG_CONFIG_HOME/sindri/config.toml — the one file Sindri reads.
#
# Two keys are required and the other nine have a default: a run cannot start
# without `model`, nor without `api_key` on a wire that wants a credential —
# `anthropic`, the default — where the provider's own environment variable will
# do in its place. Every key can be set without editing this file: environment
# variables win over it, flags win over them. An unknown key is an error naming
# the key and this file, so a typo never runs silently on defaults.

# Which wire to speak: "anthropic" (the default), or "openai" for OpenAI itself
# and every server that speaks its shape (Ollama, vLLM, LM Studio, OpenRouter),
# or "copilot" for GitHub Copilot (sign in with `sindri auth login copilot`).
provider = "anthropic"

# The model to ask. Required: no default, so a missing model is an explicit error
# rather than a guess.
model = "claude-sonnet-4-6"

# The credential. Required for `anthropic`, the wire that wants one — a local
# server reached by `base_url` often has none to give. Prefer the provider's own
# variable — ANTHROPIC_API_KEY, or SINDRI_API_KEY for API-key providers — because a
# file is plaintext. Copilot uses `sindri auth login copilot` instead. `sindri` writes this
# file only from `/settings`, 0600 and replaced atomically; values are redacted.
api_key = "sk-ant-…"

# Another API root: a gateway, a proxy, a local server. Optional; left out, the
# provider's default is used. ANTHROPIC_BASE_URL is read below this value.
base_url = "https://api.anthropic.com"

# Whether to pay for the model's reasoning. Optional, off by default: cheap tasks
# should stay cheap.
thinking = false

# Whether the run tells its terminal what it is doing, one `OSC 7501` report at a
# time: a state, a coarse line of our own words, the workspace's name. On by
# default. Never stdout, and a stderr that is not a terminal is written nothing.
status = true

# Extra directories mounted read-write besides the workspace and the session
# temp. Optional: left out, the shipped floor is mounted — ~/.cache, ~/go,
# ~/.cargo, ~/.rustup. Name a list and it is the whole of the extras: the floor is
# replaced, never added to, and `[]` is the explicit spelling of none. A path you
# name must exist, be canonical, and not nest with the workspace, or it is exit 2.
# This is why no repository-local config is ever honoured.
extra_writable_paths = ["/home/you/go/pkg/mod"]

# Whether the sandbox gets the host's ssh agent socket, so `git push` over ssh and
# `ssh-add -l` work inside it. Optional, on by default. The socket needs no mount
# — connecting across the read-only root is permitted — so this only names the
# host's SSH_AUTH_SOCK in the sandbox environment. A host with no agent leaves the
# variable absent rather than empty.
ssh_agent = true

# How many turns one run may take before it stops with exit 100. Optional: 250 by
# default, and a cap of 1 to 10000.
max_turns = 250

# How long one command may run inside the sandbox, in seconds (1–3600). Optional:
# 120 by default. `sindri sandbox exec` runs under the same timeout; its own
# `--timeout` wins where it is written.
timeout = 120

# Headers every provider request carries, for a gateway that routes on one of its
# own. Optional: absent, no header is added. SINDRI_EXTRA_HEADERS takes the same
# headers as `Name: value` lines, `--header` one per flag, and the level that
# names any replaces the rest. The values are no secret: `/settings` draws the
# table one `Name: value` per line, and a paste there takes the same lines back.
# Nothing else prints them and they are never recorded.
#
# A value may hold {session}, which is sent as the id of the session the run
# writes — the one `sindri sessions show` names and `/export` writes — so a
# gateway that caches per session is told a different id by every run, and by
# every `/new` in the frame. A value with no token is sent as it was written.
#
# It is the one setting that is a table, so it comes last: in TOML every key after
# a table header belongs to that table. The line below is a placeholder: name your
# gateway's own header, or delete the table, whose absence is the default.
[extra_headers]
x-gateway-hint = "replace this line, or delete this table"
