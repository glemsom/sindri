# $XDG_CONFIG_HOME/sindri/config.toml — the one file Sindri reads.
#
# Every key is optional, and every key can be overridden without editing this
# file: environment variables win over it, and flags win over them.
# An unknown key is an error naming both the key and this file, so a typo never
# runs silently on defaults.

# Which wire to speak: "anthropic", or "openai" for OpenAI itself and every
# server that speaks its shape (Ollama, vLLM, LM Studio, OpenRouter).
provider = "anthropic"

# Which palette to draw with: "anvil", the one there is. A closed set of names
# rather than a colour or a hex string, because a theme is held to a law — every
# colour at a floor above the canvas — that only a finite set of colours can be
# checked against. SINDRI_THEME and --theme name the same key, and the flag wins
# over the environment, which wins over this file. An unknown name is an error,
# not a fallback.
theme = "anvil"

# The model to ask. Required: there is no default, so a missing model is an
# explicit error rather than a guess.
model = "claude-sonnet-4-6"

# The credential. Prefer the provider's own environment variable —
# ANTHROPIC_API_KEY, or SINDRI_API_KEY for any provider — because a file is
# plaintext. `sindri` writes this file only from `/settings`, readable by its
# owner alone (0600) and replaced atomically; a secret typed there is announced
# on screen before it lands. Either way it is redacted from all output and
# records.
api_key = "sk-ant-…"

# Another API root: a gateway, a proxy, or a local server. Left out, the
# provider's own default is used. ANTHROPIC_BASE_URL is read below this file's
# value, so an already-exported variable needs no configuration at all.
base_url = "https://api.anthropic.com"

# Whether to pay for the model's reasoning. Off by default, because cheap tasks
# should stay cheap.
thinking = false

# Extra directories mounted read-write inside the sandbox, besides the
# workspace and the session temp. Absolute, canonical, never "/", and never one
# inside another. This is the setting that makes a repository-local config
# dangerous, which is why none is ever honoured.
extra_writable_paths = ["/home/you/go/pkg/mod"]

# How many turns one run may take before it stops with exit 100.
max_turns = 250

# How long one command may run inside the sandbox, in seconds (1–3600).
timeout = 120

# Headers every provider request carries, for a gateway that routes on one of
# its own — a session id, a referer, a routing hint. A table of names to
# values; SINDRI_EXTRA_HEADERS takes the same headers as `Name: value` lines,
# and --header takes one per flag. Names are case-insensitive, and the level
# that names any replaces the rest rather than adding to them. Never printed
# and never recorded, because a gateway's header is as likely to be a secret as
# the credential is.
#
# It is the one setting that is a table, so it comes last: in TOML every key
# after a table header belongs to that table, and a table in the middle would
# swallow the settings below it. The line below is a placeholder, like the
# credential above: name your gateway's own header, or delete the table, whose
# absence is the default.
[extra_headers]
x-gateway-hint = "replace this line, or delete this table"
