[workspace]
resolver = "3"
members = [
    "crates/types",
    "crates/core",
    "crates/harness",
    "crates/tui",
    "crates/cli",
    "crates/evals",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The floor the graph demands (`rig-core` 0.45 needs 1.97.1), not the toolchain:
# devbox.lock pins that. Declaring higher buys nothing and rots.
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/glemsom/sindri"

[workspace.dependencies]
sindri-types = { path = "crates/types" }
sindri-core = { path = "crates/core" }
sindri-harness = { path = "crates/harness" }
sindri-tui = { path = "crates/tui" }
# The frame: a renderer, not an invention. Pinned here like every
# other dependency, so the crate and its dev-dependencies cannot drift apart.
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
# crossterm's feature set is a Linux terminal's events — keys, mouse and resize,
# which is all the frame reads — and every member is named rather than left to
# the `default` set: that set carries `windows`, the Win32 bindings
# (`crossterm_winapi`, `winapi`) which no crate here compiles. Naming it here
# does not unpin them, because ratatui's own crossterm backend — the one
# `ratatui::init` opens the frame with — asks for crossterm's defaults; it keeps
# this line from being a second reason to fetch them.
crossterm = { version = "0.28", default-features = false, features = ["events"] }
ratatui-image = { version = "8", default-features = false, features = ["image-defaults", "crossterm"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pulldown-cmark = { version = "0.12", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2"
base64 = "0.22"
# A mermaid fence is a picture: the crate parses and lays the diagram out, resvg
# rasterises the svg it returns. Nothing here draws a pixel of its own.
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
resvg = { version = "0.47", default-features = false, features = ["text", "system-fonts"] }

# A curated set, not blanket `pedantic`: lints that catch mistakes an
# agent would otherwise ship, and no noise about trivial functions.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
