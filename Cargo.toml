[workspace]
resolver = "3"
members = ["crates/sindri-core", "crates/sindri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

# The renderer is measured by an eval and shipped in release, so the test profile draws it at
# the speed it ships at: unoptimized it is nine times slower than any budget was chosen for.
[profile.dev.package.mermaid-rs-renderer]
opt-level = 3
